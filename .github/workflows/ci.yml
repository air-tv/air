name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: air
    steps:
      - uses: actions/checkout@v7
        with:
          path: air
      - name: Check out public contract repositories
        run: |
          git clone --depth 1 https://github.com/get-air/stremio-addon-client.git ../stremio-addon-client
          git clone --depth 1 https://github.com/get-air/iptv.git ../iptv
          git clone --depth 1 https://github.com/get-air/video.git ../video
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify catalog schema and effective SQLite runtime
        run: >-
          ./gradlew
          verifyCommonMainAirCatalogDatabaseMigration
          assertJvmCatalogDependencies
      - run: ./gradlew jvmTest jsNodeTest wasmJsNodeTest

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: air
    steps:
      - uses: actions/checkout@v7
        with:
          path: air
      - name: Check out public contract repositories
        run: |
          git clone --depth 1 https://github.com/get-air/stremio-addon-client.git ../stremio-addon-client
          git clone --depth 1 https://github.com/get-air/iptv.git ../iptv
          git clone --depth 1 https://github.com/get-air/video.git ../video
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: ./gradlew compileReleaseKotlinAndroid

  windows-jvm-storage:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: air
    steps:
      - uses: actions/checkout@v7
        with:
          path: air
      - name: Check out public contract repositories
        shell: bash
        run: |
          git clone --depth 1 https://github.com/get-air/stremio-addon-client.git ../stremio-addon-client
          git clone --depth 1 https://github.com/get-air/iptv.git ../iptv
          git clone --depth 1 https://github.com/get-air/video.git ../video
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify atomic JVM document replacement on Windows
        run: >-
          ./gradlew jvmTest
          --tests com.getair.core.persistence.JvmFileDocumentStoreTest
          --tests com.getair.core.source.WindowsDpapiLocalSourceSecretStoreTest

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tasks: linuxX64Test
          - os: windows-latest
            tasks: mingwX64Test
          - os: macos-latest
            tasks: macosX64Test compileKotlinIosArm64 compileKotlinIosSimulatorArm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: air
    steps:
      - uses: actions/checkout@v7
        with:
          path: air
      - name: Check out public contract repositories
        shell: bash
        run: |
          git clone --depth 1 https://github.com/get-air/stremio-addon-client.git ../stremio-addon-client
          git clone --depth 1 https://github.com/get-air/iptv.git ../iptv
          git clone --depth 1 https://github.com/get-air/video.git ../video
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Linux SQLite development library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libsqlite3-dev
      - run: ./gradlew ${{ matrix.tasks }}
