name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AIR_USE_LOCAL_BUILDS: "true"
  AIR_STREMIO_REF: ff0b76f95c85dd5f64d3c6d1e788feb6bdf3a35b
  AIR_IPTV_REF: f15ab87a5b3af74ef98d6ab085dd1c1b5c0b5c52
  AIR_VIDEO_REF: 7164066dd4b1bf74e45b2a50b80b1118cca4b54e

jobs:
  portable:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: air
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: air
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: get-air/stremio-addon-client
          ref: ${{ env.AIR_STREMIO_REF }}
          path: stremio-addon-client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: get-air/iptv
          ref: ${{ env.AIR_IPTV_REF }}
          path: iptv
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: get-air/video
          ref: ${{ env.AIR_VIDEO_REF }}
          path: video
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify catalog schema and effective SQLite runtime
        run: >-
          ./gradlew
          verifyCommonMainAirCatalogDatabaseMigration
          assertJvmCatalogDependencies
      - name: Run portable and real-browser contracts
        run: >-
          ./gradlew
          jvmTest
          jsNodeTest wasmJsNodeTest
          jsBrowserTest wasmJsBrowserTest
          --max-workers=2

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: air
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: air
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: get-air/stremio-addon-client
          ref: ${{ env.AIR_STREMIO_REF }}
          path: stremio-addon-client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: get-air/iptv
          ref: ${{ env.AIR_IPTV_REF }}
          path: iptv
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: get-air/video
          ref: ${{ env.AIR_VIDEO_REF }}
          path: video
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: ./gradlew compileReleaseKotlinAndroid

  windows-jvm-storage:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: air
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: air
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: get-air/stremio-addon-client
          ref: ${{ env.AIR_STREMIO_REF }}
          path: stremio-addon-client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: get-air/iptv
          ref: ${{ env.AIR_IPTV_REF }}
          path: iptv
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: get-air/video
          ref: ${{ env.AIR_VIDEO_REF }}
          path: video
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify atomic JVM document replacement on Windows
        run: >-
          ./gradlew jvmTest
          --tests com.getair.core.persistence.JvmFileDocumentStoreTest
          --tests com.getair.core.source.WindowsDpapiLocalSourceSecretStoreTest

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tasks: linuxX64Test
          - os: windows-latest
            tasks: mingwX64Test
          - os: macos-latest
            tasks: macosX64Test compileKotlinIosArm64 compileKotlinIosSimulatorArm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: air
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: air
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: get-air/stremio-addon-client
          ref: ${{ env.AIR_STREMIO_REF }}
          path: stremio-addon-client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: get-air/iptv
          ref: ${{ env.AIR_IPTV_REF }}
          path: iptv
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: get-air/video
          ref: ${{ env.AIR_VIDEO_REF }}
          path: video
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Linux SQLite development library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsqlite3-dev
          sqlite_library="$(cc -print-file-name=libsqlite3.so)"
          test -f "$sqlite_library"
          echo "AIR_SQLITE_LIBRARY_DIR=$(dirname "$sqlite_library")" >> "$GITHUB_ENV"
      - name: Install Windows SQLite development library
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-x86_64-sqlite3"
          $sqliteLibrary = 'C:\msys64\mingw64\lib\libsqlite3.dll.a'
          if (-not (Test-Path $sqliteLibrary)) { throw 'MSYS2 SQLite import library is missing' }
          "AIR_SQLITE_LIBRARY_DIR=C:/msys64/mingw64/lib" >> $env:GITHUB_ENV
          "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
      - run: ./gradlew ${{ matrix.tasks }}
