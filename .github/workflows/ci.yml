name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AIR_USE_LOCAL_BUILDS: "true"
  AIR_STREMIO_REF: 6de103161fa53a3d66f847b2f425399c2fc16d7a
  AIR_IPTV_REF: 0e04c3df44449294da5f292b6b429d9657c2ef3a
  AIR_VIDEO_REF: b8005f484e08febb60d5d4cfb61d2c12be2d6bf5

jobs:
  package-fixture-linux:
    runs-on: ubuntu-latest
    outputs:
      fixture-sha256: ${{ steps.fixture-manifest.outputs.sha256 }}
    defaults:
      run:
        working-directory: air
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: air
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: air-tv/stremio-addon-client
          ref: ${{ env.AIR_STREMIO_REF }}
          path: stremio-addon-client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: air-tv/iptv
          ref: ${{ env.AIR_IPTV_REF }}
          path: iptv
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: air-tv/video
          ref: ${{ env.AIR_VIDEO_REF }}
          path: video
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Publish Linux-owned package fixture
        run: ./scripts/publish-package-fixture.sh linux "$RUNNER_TEMP/air-maven"
      - id: fixture-manifest
        name: Hash every Linux fixture file
        run: |
          manifest_hash="$(./scripts/write-package-fixture-manifest.sh "$RUNNER_TEMP/air-maven")"
          printf 'sha256=%s\n' "$manifest_hash" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: air-packages-linux
          path: ${{ runner.temp }}/air-maven
          if-no-files-found: error
          retention-days: 1

  package-fixture-apple:
    runs-on: macos-latest
    outputs:
      fixture-sha256: ${{ steps.fixture-manifest.outputs.sha256 }}
    defaults:
      run:
        working-directory: air
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: air
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: air-tv/stremio-addon-client
          ref: ${{ env.AIR_STREMIO_REF }}
          path: stremio-addon-client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: air-tv/iptv
          ref: ${{ env.AIR_IPTV_REF }}
          path: iptv
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: air-tv/video
          ref: ${{ env.AIR_VIDEO_REF }}
          path: video
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Publish Apple-owned package fixture
        run: ./scripts/publish-package-fixture.sh apple "$RUNNER_TEMP/air-maven"
      - id: fixture-manifest
        name: Hash every Apple fixture file
        run: |
          manifest_hash="$(./scripts/write-package-fixture-manifest.sh "$RUNNER_TEMP/air-maven")"
          printf 'sha256=%s\n' "$manifest_hash" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: air-packages-apple
          path: ${{ runner.temp }}/air-maven
          if-no-files-found: error
          retention-days: 1

  package-fixture-windows:
    runs-on: windows-latest
    outputs:
      fixture-sha256: ${{ steps.fixture-manifest.outputs.sha256 }}
    defaults:
      run:
        shell: bash
        working-directory: air
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: air
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: air-tv/stremio-addon-client
          ref: ${{ env.AIR_STREMIO_REF }}
          path: stremio-addon-client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: air-tv/iptv
          ref: ${{ env.AIR_IPTV_REF }}
          path: iptv
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: air-tv/video
          ref: ${{ env.AIR_VIDEO_REF }}
          path: video
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Publish Windows-owned package fixture
        run: ./scripts/publish-package-fixture.sh windows "$RUNNER_TEMP/air-maven"
      - id: fixture-manifest
        name: Hash every Windows fixture file
        run: |
          manifest_hash="$(./scripts/write-package-fixture-manifest.sh "$RUNNER_TEMP/air-maven")"
          printf 'sha256=%s\n' "$manifest_hash" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: air-packages-windows
          path: ${{ runner.temp }}/air-maven
          if-no-files-found: error
          retention-days: 1

  package-contract:
    needs: [package-fixture-linux, package-fixture-apple, package-fixture-windows]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: air
    env:
      AIR_USE_LOCAL_BUILDS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: air
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: air-packages-linux
          path: ${{ runner.temp }}/air-package-fixtures/linux
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: air-packages-apple
          path: ${{ runner.temp }}/air-package-fixtures/apple
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: air-packages-windows
          path: ${{ runner.temp }}/air-package-fixtures/windows
      - name: Verify every downloaded fixture byte
        env:
          LINUX_FIXTURE_SHA256: ${{ needs.package-fixture-linux.outputs.fixture-sha256 }}
          APPLE_FIXTURE_SHA256: ${{ needs.package-fixture-apple.outputs.fixture-sha256 }}
          WINDOWS_FIXTURE_SHA256: ${{ needs.package-fixture-windows.outputs.fixture-sha256 }}
        run: |
          ./scripts/verify-package-fixture-manifest.sh \
            "$RUNNER_TEMP/air-package-fixtures/linux" "$LINUX_FIXTURE_SHA256"
          ./scripts/verify-package-fixture-manifest.sh \
            "$RUNNER_TEMP/air-package-fixtures/apple" "$APPLE_FIXTURE_SHA256"
          ./scripts/verify-package-fixture-manifest.sh \
            "$RUNNER_TEMP/air-package-fixtures/windows" "$WINDOWS_FIXTURE_SHA256"
      - name: Merge host fixtures without overwriting coordinates
        run: >-
          ./scripts/merge-package-fixtures.sh
          "$RUNNER_TEMP/air-maven"
          "$RUNNER_TEMP/air-package-fixtures/linux"
          "$RUNNER_TEMP/air-package-fixtures/apple"
          "$RUNNER_TEMP/air-package-fixtures/windows"
      - name: Compile every Air target from packages only
        run: ./scripts/verify-package-consumer.sh "$RUNNER_TEMP/air-maven"

  portable:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: air
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: air
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: air-tv/stremio-addon-client
          ref: ${{ env.AIR_STREMIO_REF }}
          path: stremio-addon-client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: air-tv/iptv
          ref: ${{ env.AIR_IPTV_REF }}
          path: iptv
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: air-tv/video
          ref: ${{ env.AIR_VIDEO_REF }}
          path: video
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify catalog schema and effective SQLite runtime
        run: >-
          ./gradlew
          verifyCommonMainAirCatalogDatabaseMigration
          assertJvmCatalogDependencies
      - name: Run portable and real-browser contracts
        run: >-
          ./gradlew
          jvmTest
          jsNodeTest wasmJsNodeTest
          jsBrowserTest wasmJsBrowserTest
          --max-workers=2

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: air
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: air
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: air-tv/stremio-addon-client
          ref: ${{ env.AIR_STREMIO_REF }}
          path: stremio-addon-client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: air-tv/iptv
          ref: ${{ env.AIR_IPTV_REF }}
          path: iptv
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: air-tv/video
          ref: ${{ env.AIR_VIDEO_REF }}
          path: video
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: ./gradlew compileReleaseKotlinAndroid

  windows-jvm-storage:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: air
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: air
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: air-tv/stremio-addon-client
          ref: ${{ env.AIR_STREMIO_REF }}
          path: stremio-addon-client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: air-tv/iptv
          ref: ${{ env.AIR_IPTV_REF }}
          path: iptv
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: air-tv/video
          ref: ${{ env.AIR_VIDEO_REF }}
          path: video
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify atomic JVM document replacement on Windows
        run: >-
          ./gradlew jvmTest
          --tests com.getair.core.persistence.JvmFileDocumentStoreTest
          --tests com.getair.core.source.WindowsDpapiLocalSourceSecretStoreTest

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tasks: linuxX64Test
          - os: windows-latest
            tasks: mingwX64Test
          - os: macos-latest
            tasks: macosX64Test compileKotlinIosArm64 compileKotlinIosSimulatorArm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: air
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: air
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: air-tv/stremio-addon-client
          ref: ${{ env.AIR_STREMIO_REF }}
          path: stremio-addon-client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: air-tv/iptv
          ref: ${{ env.AIR_IPTV_REF }}
          path: iptv
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: air-tv/video
          ref: ${{ env.AIR_VIDEO_REF }}
          path: video
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Linux SQLite development library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsqlite3-dev
          sqlite_library="$(cc -print-file-name=libsqlite3.so)"
          test -f "$sqlite_library"
          echo "AIR_SQLITE_LIBRARY_DIR=$(dirname "$sqlite_library")" >> "$GITHUB_ENV"
      - name: Install Windows SQLite development library
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-x86_64-sqlite3"
          $sqliteLibrary = 'C:\msys64\mingw64\lib\libsqlite3.dll.a'
          if (-not (Test-Path $sqliteLibrary)) { throw 'MSYS2 SQLite import library is missing' }
          "AIR_SQLITE_LIBRARY_DIR=C:/msys64/mingw64/lib" >> $env:GITHUB_ENV
          "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
      - run: ./gradlew ${{ matrix.tasks }}
