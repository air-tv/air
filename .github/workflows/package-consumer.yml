name: Package Consumer

on:
  workflow_dispatch:
    inputs:
      stremio_version:
        description: Stable Stremio KMP package version
        required: true
        type: string
      iptv_version:
        description: Stable IPTV KMP package version
        required: true
        type: string
      video_version:
        description: Stable video KMP package version
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  clean-package-consumer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: air
    env:
      AIR_USE_LOCAL_BUILDS: "false"
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GET_AIR_STREMIO_VERSION: ${{ inputs.stremio_version }}
      GET_AIR_IPTV_VERSION: ${{ inputs.iptv_version }}
      GET_AIR_VIDEO_VERSION: ${{ inputs.video_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: air
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify explicit GitHub Packages without composite substitution
        run: >-
          ./gradlew
          assertPackageDependencyMode
          compileCommonMainKotlinMetadata
          compileKotlinJvm
          compileKotlinJs
          compileKotlinWasmJs
          -PuseLocalAirBuilds=false
          --max-workers=2
          --no-daemon
          --no-configuration-cache
